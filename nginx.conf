server {
    listen 80;
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/x-javascript 
        application/xml 
        application/xml+rss 
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static images and fonts (1 Year Immutable)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache JS and CSS bundles (1 Year Immutable)
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Search Engine Crawlers & AI Agent Documentation
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }
    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
    }


    # 301 Permanent Redirects for Legacy WordPress URLs
    location ~* ^/automatic-sliding-gates {
        return 301 $scheme://$http_host/#sliding-gates;
    }
    location ~* ^/swing-gates {
        return 301 $scheme://$http_host/#swing-gates;
    }
    location ~* ^/solar-automatic-gates {
        return 301 $scheme://$http_host/#solar-gates;
    }
    location ~* ^/gallery-gates {
        return 301 $scheme://$http_host/#gallery;
    }
    location ~* ^/instant-online-quote {
        return 301 $scheme://$http_host/#gate-visualizer;
    }
    location ~* ^/quote-request {
        return 301 $scheme://$http_host/#gate-visualizer;
    }
    location ~* ^/automatic-gates-ipswich {
        return 301 $scheme://$http_host/gates-ipswich;
    }
    location ~* ^/automated-gates-brisbane {
        return 301 $scheme://$http_host/gates-brisbane;
    }
    location ~* ^/electric-gate-motors|/motors {
        return 301 $scheme://$http_host/#motor-showcase;
    }
    location ~* ^/book-an-appointment {
        return 301 $scheme://$http_host/contact-us;
    }

    # SPA Routing: Fallback to index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
