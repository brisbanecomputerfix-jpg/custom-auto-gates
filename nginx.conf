server {
    listen 80;
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/x-javascript 
        application/xml 
        application/xml+rss 
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static images and fonts (1 Year Immutable)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache JS and CSS bundles (1 Year Immutable)
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Search Engine Crawlers & AI Agent Documentation
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }
    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
    }
    location = /llms-full.txt {
        default_type text/plain;
        try_files $uri =404;
    }



    # 301 Permanent Redirects for Legacy WordPress URLs (SEO Traffic Preservation)
    # Directs historical GSC URLs to clean, dedicated landing pages without hash truncation
    location ~* ^/gates/driveway-gates/?$ {
        return 301 $scheme://$http_host/driveway-gates;
    }
    location ~* ^/gates/swing-gates/?$ {
        return 301 $scheme://$http_host/swing-gates;
    }
    location ~* ^/gate-automation/solar-automatic-gates/?$ {
        return 301 $scheme://$http_host/solar-gates;
    }
    location ~* ^/solar-automatic-gates/?$ {
        return 301 $scheme://$http_host/solar-gates;
    }
    location ~* ^/gates/automatic-sliding-gates-brisbane/?$ {
        return 301 $scheme://$http_host/automatic-sliding-gates;
    }
    location ~* ^/gates/automatic-gates/?$ {
        return 301 $scheme://$http_host/driveway-gates;
    }
    location ~* ^/gates/gallery-gates/?$ {
        return 301 $scheme://$http_host/#gallery;
    }
    location ~* ^/gallery-gates/?$ {
        return 301 $scheme://$http_host/#gallery;
    }
    location ~* ^/instant-online-quote/?$ {
        return 301 $scheme://$http_host/#gate-visualizer;
    }
    location ~* ^/quote-request/?$ {
        return 301 $scheme://$http_host/#gate-visualizer;
    }
    location ~* ^/automatic-gates-ipswich/?$ {
        return 301 $scheme://$http_host/gates-ipswich;
    }
    location ~* ^/automated-gates-brisbane/?$ {
        return 301 $scheme://$http_host/gates-brisbane;
    }
    location ~* ^/(electric-gate-motors|motors)/?$ {
        return 301 $scheme://$http_host/#motor-showcase;
    }
    location ~* ^/book-an-appointment/?$ {
        return 301 $scheme://$http_host/contact-us;
    }
    location ~* ^/(gate-cost-guide|automatic-gates-brisbane-price)/?$ {
        return 301 $scheme://$http_host/pricing-guide;
    }
    location ~* ^/(gates/security-commercial-electric-gates|gates/secuirty-commercial-electric-gates|gate-automation/automatic-boom-gates|gate-automation-boom-gates-road-barriers|boom-gates|commercial-boom-gates)/?$ {
        return 301 $scheme://$http_host/commercial-gates;
    }
    location ~* ^/(gate-repairs|gate-repairs-brisbane|electric-gate-repairs|automatic-gate-repairs)/?$ {
        return 301 $scheme://$http_host/service;
    }

    # SPA Routing: Fallback to index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ==============================================================================
# STRATEGIC TOPIC-LEVEL 301 DOMAIN REDIRECTS (Domain Authority & Topical Silos)
# ==============================================================================

# 1. Automatic Sliding Gates Silo (Exact Keyword Match)
server {
    listen 80;
    listen 3000;
    server_name automaticslidegate.com.au www.automaticslidegate.com.au;
    return 301 https://customautogates.com.au/automatic-sliding-gates;
}

# 2. Commercial Boom Gates & Traffic Barriers Silo
server {
    listen 80;
    listen 3000;
    server_name 
        boomgatesbrisbane.com.au www.boomgatesbrisbane.com.au 
        qldboomgates.com.au www.qldboomgates.com.au;
    return 301 https://customautogates.com.au/commercial-gates;
}

# 3. Brand & General Gates Silo (Homepage Funnel with Query Preservation)
server {
    listen 80;
    listen 3000;
    server_name 
        deluxegates.com.au www.deluxegates.com.au 
        deluxeautogates.com.au www.deluxeautogates.com.au 
        deluxeautomaticgates.com.au www.deluxeautomaticgates.com.au;
    return 301 https://customautogates.com.au$request_uri;
}
